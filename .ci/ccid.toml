schema = 1
project = "cfbk"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["node", "--version"], ["python3", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
